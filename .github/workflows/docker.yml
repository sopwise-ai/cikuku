name: Docker

on:
  pull_request:
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - ".npmrc"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "public/**"
      - ".github/workflows/docker.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=https://cikuku.example.com --tag cikuku:ci .
      - name: Smoke test
        run: |
          docker run --detach --name cikuku --publish 3000:3000 \
            --env NEXT_PUBLIC_APP_URL=https://cikuku.example.com cikuku:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs cikuku
          exit 1
