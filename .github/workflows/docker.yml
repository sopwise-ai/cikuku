name: Docker

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build image
        run: docker build --build-arg NEXT_PUBLIC_APP_URL=https://cikuku.example.com --tag cikuku:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: cikuku:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL
          vuln-type: os,library
      - name: Smoke test
        run: |
          docker run --detach --name cikuku --publish 3000:3000 \
            --env NEXT_PUBLIC_APP_URL=https://cikuku.example.com cikuku:ci
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:3000/ | grep -q "A production-ready starter"
          curl --fail --silent --head http://127.0.0.1:3000/ | grep -qi "content-security-policy"
          test "$(docker exec cikuku id -u)" = "1001"
          docker rm --force cikuku
