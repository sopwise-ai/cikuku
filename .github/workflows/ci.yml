name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Format
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Knip
        run: npm run knip
      - name: Test
        run: npm run test:coverage
      # Dependency review is unavailable while the repository Dependency graph
      # is disabled; npm audit blocks high/critical runtime advisories.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: https://cikuku.example.com
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Verify /api/health is request-time
        run: |
          test -f .next/prerender-manifest.json
          if grep -q '"/api/health"' .next/prerender-manifest.json; then
            echo "Expected /api/health to be request-time"
            exit 1
          fi
      - name: Verify the production URL is required
        run: |
          if NEXT_PUBLIC_APP_URL= npm run build > /tmp/missing-url.log 2>&1; then
            echo "Expected the build to fail without NEXT_PUBLIC_APP_URL"
            exit 1
          fi
          grep -q "NEXT_PUBLIC_APP_URL is required" /tmp/missing-url.log

  e2e:
    name: e2e
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: End-to-end tests
        run: npm run test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
