name: Bug report
description: Report reproducible incorrect behavior.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please search existing issues before opening a new one.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      multiple: true
      options:
        - Local development
        - Production
        - Continuous integration
  - type: input
    id: version
    attributes:
      label: Commit or version
      placeholder: main@1e0967e
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
