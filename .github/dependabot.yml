version: 2

updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      next-ecosystem:
        patterns:
          - next
          - react
          - react-dom
          - eslint-config-next
          - "@next/*"
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # TypeScript 7 is not supported by typescript-eslint yet.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # ESLint 10 is not yet declared as a peer dependency by the plugins
      # bundled with eslint-config-next 16.4.5.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
